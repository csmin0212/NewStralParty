<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>뭇별 · 별빛이 머무는 창가</title><link rel="stylesheet" href="memorial/night.css"></head>
<body>
<main class="frame" id="frame" aria-label="별이 보이는 밤 도시와 뭇별 레이어 애니메이션">
  <div class="world"><div class="stack">
    <div class="plate background" data-layer="background"><img src="assets/characters/mutbyeol/memorial/night-v3/background.webp" alt="별이 보이는 밤 도시와 비어 있는 창가 좌석"></div>
    <div class="stars" id="stars" data-layer="stars" aria-hidden="true"></div>
    <div class="actor" data-layer="character"><div class="reaction" id="reaction">
      <div class="hair" data-layer="hair"><img src="assets/characters/mutbyeol/memorial/night-v3/hair-back.webp" alt="바람에 잔잔히 움직이는 은회색과 민트색 긴 머리"></div>
      <div class="body"><img src="assets/characters/mutbyeol/memorial/night-v3/body.webp" alt="헤드폰을 만지며 미소 짓는 뭇별"></div>
      <div class="eyes" aria-hidden="true"><img src="assets/characters/mutbyeol/memorial/night-v3/eyes-closed.webp" alt=""></div>
    </div></div>
    <div class="glow" data-layer="light"></div>
  </div><img class="original" src="assets/characters/mutbyeol/memorial/night-v3/original.webp" alt="승인한 밤 도시 원본 그림"></div>
</main>
<a class="chrome back" href="assets/gallery.html#lobby">← 에셋 라이브러리</a>
<div class="chrome edition">MUTBYEOL · STARRY NIGHT</div>
<div class="chrome caption"><div class="eyebrow">뭇별 · MEMORIAL LOBBY</div><h1>별빛이 머무는 창가</h1><p id="line">…밖에 별, 꽤 잘 보이지?</p></div>
<section class="chrome panel" id="panel" hidden aria-label="애니메이션과 레이어 설정">
  <h2>별빛이 머무는 창가</h2><p>그림을 겹쳐 만든 레이어 애니메이션입니다.<br>캐릭터를 누르면 작은 반응을 보여요.</p>
  <label><input type="checkbox" data-toggle="light" checked>실내의 은은한 빛<span>조명</span></label>
  <label><input type="checkbox" data-toggle="stars" checked>별빛 반짝임<span>밤하늘</span></label>
  <label><input type="checkbox" data-effect="eyes" checked>눈 깜빡임<span>표정</span></label>
  <button id="eye-preview" type="button" aria-pressed="false">감은 눈 확인</button>
  <label><input type="checkbox" data-effect="hair" checked>머리카락 흔들림<span>움직임</span></label>
  <label><input type="checkbox" data-toggle="character" checked>뭇별 · 호흡<span>캐릭터</span></label>
  <label><input type="checkbox" data-toggle="background" checked>빈 방 · 밤 도시<span>배경</span></label>
  <label><input type="checkbox" id="parallax" checked>커서 깊이 이동<span>시차</span></label>
  <a href="memorial-day.html">처음 만든 낮 버전 보기 ↗</a>
</section>
<nav class="chrome toolbar" aria-label="미리보기 조작"><button id="play" type="button" aria-pressed="false">일시 정지</button><button id="compare" type="button" aria-pressed="false">원본 비교</button><button id="layers" type="button" aria-expanded="false" aria-controls="panel">레이어 보기</button><button id="clean" type="button">그림만 보기</button></nav>
<div class="loader" id="loader" role="status"><div>별빛이 머무는 창가를 준비하고 있어요…<small>뭇별 · 밤 도시</small></div></div>
<script src="memorial/night.js" defer></script>
</body></html>
