<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>뭇별 · 창가에 머문 오후</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#112737;color:#f7fcff;font:14px/1.5 'Malgun Gothic',system-ui,sans-serif;overflow:hidden}button,input{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #39cbd3;outline-offset:4px}.stage{position:absolute;inset:0;display:grid;place-items:center}.frame{width:min(100vw,177.7778vh);aspect-ratio:16/9;position:relative;overflow:hidden;background:#daeafa;isolation:isolate;--px:0;--py:0}.scene{position:absolute;inset:-1.5%;transform:scale(1.005)}.layer,.original{position:absolute;inset:0}.layer img,.original{width:100%;height:100%;object-fit:fill;display:block;pointer-events:none;user-select:none}.background{transform:translate(calc(var(--px)*-3px),calc(var(--py)*-2px))}.character{transform:translate(calc(var(--px)*-7px),calc(var(--py)*-4px))}.character img{transform-origin:47% 90%;animation:breathe 5.5s ease-in-out infinite}.foreground{transform:translate(calc(var(--px)*-14px),calc(var(--py)*-8px))}.foreground img{transform-origin:0 0;animation:breeze 8s ease-in-out infinite}.light{position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 8%,#fff7d52b 23%,transparent 42%,#e7fbff0c 65%,transparent 80%);mix-blend-mode:screen;animation:sunlight 11s ease-in-out infinite}.dust{position:absolute;inset:0;overflow:hidden;pointer-events:none}.dust i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fffce8;box-shadow:0 0 8px 2px #fff6cd88;left:var(--left);top:110%;opacity:0;animation:drift var(--duration) linear var(--delay) infinite}.original{z-index:10;display:none}.compare .original{display:block}.compare .scene{visibility:hidden}.paused *, .compare *{animation-play-state:paused!important}.disabled{visibility:hidden}.shade{position:absolute;inset:65% 0 0;background:linear-gradient(transparent,#152c467d);pointer-events:none;z-index:12}.caption{position:absolute;bottom:30px;left:36px;z-index:13;text-shadow:0 2px 16px #16364c55}.caption small{letter-spacing:.23em;font-size:10px}.caption h1{font-size:27px;margin:4px 0 6px;font-weight:600;letter-spacing:.1em}.caption p{margin:0;font-size:12px;color:#effaffdc}.toolbar{position:fixed;bottom:18px;right:22px;z-index:30;display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.toolbar button,.back{background:#f6fcfff0;color:#294d63;border:1px solid #d1ebf2;border-radius:22px;padding:9px 16px;box-shadow:0 3px 18px #17395118;text-decoration:none;font-size:12px;backdrop-filter:blur(10px)}.toolbar button[aria-pressed=true]{background:#237c8b;color:#fff;border-color:#67d9dc}.back{position:fixed;left:20px;top:18px;z-index:30}.badge{position:fixed;right:22px;top:21px;z-index:30;font-size:10px;letter-spacing:.15em;color:#31536a;background:#f7fcffe8;padding:7px 14px;border-radius:18px}.panel{position:fixed;right:22px;bottom:76px;z-index:31;width:276px;padding:19px;background:#f6fcfff2;color:#31536a;border:1px solid #d1eaf2;border-radius:16px;box-shadow:0 12px 40px #14384a30;backdrop-filter:blur(15px)}.panel[hidden]{display:none}.panel h2{font-size:14px;margin:0 0 5px}.panel p{font-size:11px;color:#678294;margin:0 0 12px}.panel label{display:flex;align-items:center;gap:9px;padding:10px 0;border-top:1px solid #dcebf0;font-size:12px}.panel input{accent-color:#3b9fba}.panel label span{margin-left:auto;color:#819ba9;font-size:10px}.status{position:fixed;inset:0;display:grid;place-items:center;background:#eaf6ff;color:#31536a;z-index:50}.status[hidden]{display:none}@keyframes breathe{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-2px) scale(1.0035,1.005)}}@keyframes breeze{0%,100%{transform:rotate(-.09deg) translateX(0)}50%{transform:rotate(.09deg) translateX(1px)}}@keyframes sunlight{0%,100%{opacity:.35;transform:translateX(-1%)}50%{opacity:.75;transform:translateX(1%)}}@keyframes drift{0%{transform:translate(0,0);opacity:0}15%,75%{opacity:.55}100%{transform:translate(45px,-85vh);opacity:0}}@media(max-width:650px){.caption{left:20px;bottom:18px}.caption h1{font-size:19px}.caption p{font-size:10px}.toolbar{right:12px;left:12px;bottom:12px;justify-content:center}.toolbar button{padding:8px 12px}.panel{right:12px;bottom:65px}.badge{right:12px;font-size:9px}.back{left:12px}.caption small{font-size:8px}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.layer{transform:none!important}}
@media(max-aspect-ratio:4/5){.frame{width:100vw;height:100dvh;aspect-ratio:auto}.layer img,.original{object-fit:cover;object-position:38% center}.caption{bottom:90px;left:22px}.badge{display:none}.panel{bottom:65px}.toolbar{bottom:20px}}
</style>
</head>
<body>
<div class="stage"><main class="frame" id="frame" aria-label="뭇별 창가 로비 레이어 애니메이션">
  <div class="scene">
    <div class="layer background" data-layer="background"><img src="assets/characters/mutbyeol/memorial/background.webp" alt="햇빛 드는 빈 동아리방과 창밖 학원 도시"></div>
    <div class="layer character" data-layer="character"><img src="assets/characters/mutbyeol/memorial/character.webp" alt="창가에 앉아 헤드폰을 만지는 뭇별"></div>
    <div class="layer foreground" data-layer="foreground"><img src="assets/characters/mutbyeol/memorial/foreground.webp" alt="가까운 커튼과 테이블, 흐릿한 나뭇잎"></div>
    <div class="light" data-layer="light"></div>
    <div class="dust" id="dust" data-layer="dust" aria-hidden="true"></div>
  </div>
  <img class="original" src="assets/characters/mutbyeol/memorial/original.webp" alt="레이어 분리 전 원본 일러스트">
  <div class="shade"></div>
  <div class="caption"><small>MUTBYEOL · MEMORIAL</small><h1>창가에 머문 오후</h1><p>커서를 움직여 장면의 깊이를 느껴보세요.</p></div>
</main></div>
<a class="back" href="assets/gallery.html#lobby">← 에셋 라이브러리</a>
<div class="badge">뭇별 · LAYER ANIMATION</div>
<section class="panel" id="panel" hidden aria-label="레이어 표시 설정">
  <h2>겹쳐진 장면</h2><p>레이어를 껐다 켜며 분리 결과를 확인하세요.<br>캐릭터는 한 파츠로 호흡하고, 전경은 따로 흔들립니다.</p>
  <label><input type="checkbox" data-toggle="dust" checked>햇빛 속 먼지<span>05</span></label>
  <label><input type="checkbox" data-toggle="light" checked>빛의 흐름<span>04</span></label>
  <label><input type="checkbox" data-toggle="foreground" checked>커튼 · 테이블 · 잎<span>03</span></label>
  <label><input type="checkbox" data-toggle="character" checked>뭇별 · 호흡<span>02</span></label>
  <label><input type="checkbox" data-toggle="background" checked>빈 방 · 창밖 도시<span>01</span></label>
</section>
<nav class="toolbar" aria-label="미리보기 조작">
  <button id="play" type="button" aria-pressed="false">일시 정지</button>
  <button id="compare" type="button" aria-pressed="false">원본 비교</button>
  <button id="layers" type="button" aria-expanded="false" aria-controls="panel">레이어 보기</button>
</nav>
<div class="status" id="status" role="status">창가의 오후를 준비하고 있어요…</div>
<script>
const frame=document.querySelector('#frame'),play=document.querySelector('#play'),compare=document.querySelector('#compare'),layers=document.querySelector('#layers'),panel=document.querySelector('#panel');
let paused=matchMedia('(prefers-reduced-motion: reduce)').matches,comparing=false;
function refresh(){frame.classList.toggle('paused',paused);frame.classList.toggle('compare',comparing);play.textContent=paused?'재생':'일시 정지';play.setAttribute('aria-pressed',String(paused));compare.setAttribute('aria-pressed',String(comparing));}
play.addEventListener('click',()=>{paused=!paused;refresh()});
compare.addEventListener('click',()=>{comparing=!comparing;refresh()});
layers.addEventListener('click',()=>{panel.hidden=!panel.hidden;layers.setAttribute('aria-expanded',String(!panel.hidden))});
panel.addEventListener('change',e=>{const name=e.target.dataset.toggle;if(name)document.querySelector('[data-layer="'+name+'"]').classList.toggle('disabled',!e.target.checked)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){panel.hidden=true;layers.setAttribute('aria-expanded','false')}});
for(let i=0;i<22;i++){const dot=document.createElement('i');dot.style.cssText=`--left:${(i*43+9)%100}%;--duration:${12+(i*7)%13}s;--delay:-${(i*11)%24}s`;document.querySelector('#dust').append(dot)}
let tx=0,ty=0,x=0,y=0;
frame.addEventListener('pointermove',e=>{const r=frame.getBoundingClientRect();tx=(e.clientX-r.left)/r.width*2-1;ty=(e.clientY-r.top)/r.height*2-1});
frame.addEventListener('pointerleave',()=>{tx=ty=0});
function tick(){if(!paused&&!comparing){x+=(tx-x)*.045;y+=(ty-y)*.045;frame.style.setProperty('--px',x.toFixed(4));frame.style.setProperty('--py',y.toFixed(4))}requestAnimationFrame(tick)}
refresh();tick();
Promise.all([...document.querySelectorAll('main img')].map(im=>im.decode())).then(()=>document.querySelector('#status').hidden=true).catch(()=>{document.querySelector('#status').textContent='이미지를 불러오지 못했습니다. 페이지를 새로고침해 주세요.'});
</script>
</body></html>
